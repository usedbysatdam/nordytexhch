<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M13 2 4 14h6l-1 8 9-12h-6z' fill='currentColor'/></svg>">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pengaturan Admin — Nordy Tech</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css?v=26">
  <link rel="stylesheet" href="../css/globals.css?v=26">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="../css/components.css?v=28">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="admin-shell">
    <aside class="admin-side" id="adminSide" aria-label="Navigasi admin"></aside>
    <main class="admin-main" id="adminMain">
      <header class="admin-topbar">
        <div>
          <span class="eyebrow">Pengaturan</span>
          <h1>Pengaturan Toko</h1>
        </div>
      </header>
      <form id="settingsForm" class="stack stack-4" style="max-width:600px">
        <div class="field">
          <label>Nama Toko</label>
          <input type="text" id="storeName" class="input">
        </div>
        <div class="field">
          <label>WhatsApp Penjual (format: 628xxx)</label>
          <input type="text" id="sellerWhatsapp" class="input">
        </div>
        <div class="field">
          <label>Instruksi Pembayaran</label>
          <textarea id="paymentInstructions" class="textarea" rows="6"></textarea>
        </div>
        <div class="field">
          <label>Hero Title</label>
          <input type="text" id="heroTitle" class="input">
        </div>
        <div class="field">
          <label>Hero Subtitle</label>
          <textarea id="heroSubtitle" class="textarea" rows="2"></textarea>
        </div>
        <button type="submit" class="button">Simpan Pengaturan</button>
      </form>
    </main>
  </div>
  <script src="../js/config.js?v=26"></script>
  <script src="../js/utils.js?v=26"></script>
  <script src="../js/supabase-client.js?v=26"></script>
  <script src="../js/admin-guard.js?v=26"></script>
  <script src="admin-pengaturan.js?v=26"></script>
</body>
</html>
